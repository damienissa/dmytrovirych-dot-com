<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Site icon">
  <!--
    The favicon, and the one file in the design that cannot read a token.

    An SVG served as an asset has no stylesheet and no imports, so the two
    colours below are literals: #0e1414 is ICON.tile and #ff4d2e is RING.coral.
    `lib/palette.test.ts` parses this file and fails when they drift.

    Near-black on the tile even though the page is now near-black too, and they
    are deliberately not the same token: an icon is drawn on somebody's tab
    strip or dock, whose colour is their choice and not ours. It has to be
    legible on all of them, so it is one fixed pair that never follows anything
    — see the note on `ICON` in lib/palette.ts.

    The glyph is the brand ring drawn as geometry rather than set as text: an
    open arc (a goal most of the way closed) with the pace tick floating in the
    gap ahead of it. A tab favicon renders at 16px, where anything
    font-dependent is at the mercy of whatever the reader has installed.
  -->
  <!-- macOS app icons are squircles; 23% of the side is the right corner radius. -->
  <rect width="64" height="64" rx="14.7" fill="#0e1414"/>
  <!--
    The ring: r=17 centred, drawn from 12 o'clock clockwise through ~300°,
    leaving the gap where the remaining progress would go.
  -->
  <path d="M32 15 A 17 17 0 1 1 17.28 23.5" fill="none" stroke="#ff4d2e"
        stroke-width="7" stroke-linecap="round"/>
  <!-- The pace tick: a short radial dash inside the open gap, ahead of the arc. -->
  <path d="M24.65 19.27 21.15 13.2" fill="none" stroke="#ff4d2e"
        stroke-width="5" stroke-linecap="round"/>
</svg>
